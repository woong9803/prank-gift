<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>선물이 도착했습니다!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100%;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        #container {
            text-align: center;
            cursor: pointer;
            user-select: none;
        }

        .emoji {
            font-size: clamp(8rem, 40vw, 15rem);
            display: block;
            transition: transform 0.2s active;
        }

        #gift {
            animation: bounce 2s infinite ease-in-out;
        }

        #money {
            display: none;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #poop {
            display: none;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .money-rain {
            position: fixed;
            top: -50px;
            font-size: 2rem;
            pointer-events: none;
            z-index: 99;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .hidden {
            display: none !important;
        }

        .show {
            display: block !important;
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="gift" class="emoji">🎁</div>
        <div id="money" class="emoji">💵</div>
        <div id="poop" class="emoji">💩</div>
    </div>

    <script>
        const gift = document.getElementById('gift');
        const money = document.getElementById('money');
        const poop = document.getElementById('poop');

        function createMoney() {
            const currencies = ['💵', '💰', '💸', '🪙', '💎'];
            const el = document.createElement('div');
            el.className = 'money-rain';
            el.innerText = currencies[Math.floor(Math.random() * currencies.length)];
            
            const startX = Math.random() * window.innerWidth;
            const duration = Math.random() * 2 + 1;
            const size = Math.random() * 2 + 1;
            
            el.style.left = startX + 'px';
            el.style.animationDuration = duration + 's';
            el.style.fontSize = size + 'rem';
            el.style.opacity = Math.random();
            
            document.body.appendChild(el);
            setTimeout(() => el.remove(), duration * 1000);
        }

        gift.addEventListener('click', () => {
            gift.classList.add('hidden');
            money.classList.add('show');
            
            if (window.navigator.vibrate) {
                window.navigator.vibrate([100, 50, 100]);
            }

            // Start money rain
            for(let i = 0; i < 50; i++) {
                setTimeout(createMoney, i * 50);
            }
            window.moneyInterval = setInterval(createMoney, 150);
        });

        money.addEventListener('click', () => {
            money.classList.remove('show');
            money.classList.add('hidden');
            poop.classList.add('show');
            
            if (window.navigator.vibrate) {
                window.navigator.vibrate(500);
            }

            // Stop the money rain when poop appears
            if (window.moneyInterval) {
                clearInterval(window.moneyInterval);
            }
            
            document.body.style.background = '#f0e4d7'; // Slight color change for poop
        });
    </script>
</body>
</html>
