<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>선물이 도착했습니다!</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --accent-color: #ff4757;
            --text-color: #2f3542;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100%;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        #container {
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s active;
        }

        #gift {
            font-size: clamp(8rem, 40vw, 15rem);
            display: block;
            animation: bounce 2s infinite ease-in-out;
            user-select: none;
        }

        #message {
            display: none;
            font-size: clamp(2rem, 10vw, 5rem);
            font-weight: 900;
            color: #2ecc71;
            word-break: keep-all;
            user-select: none;
            z-index: 100;
            position: relative;
        }

        .money {
            position: fixed;
            top: -50px;
            font-size: 2rem;
            pointer-events: none;
            z-index: 99;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        .hidden {
            display: none !important;
        }

        .show {
            display: block !important;
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="gift">🎁</div>
        <div id="message">대박 기원! 💰</div>
    </div>

    <script>
        const container = document.getElementById('container');
        const gift = document.getElementById('gift');
        const message = document.getElementById('message');

        function createMoney() {
            const currencies = ['💵', '💰', '💸', '🪙', '💎'];
            const money = document.createElement('div');
            money.className = 'money';
            money.innerText = currencies[Math.floor(Math.random() * currencies.length)];
            
            const startX = Math.random() * window.innerWidth;
            const duration = Math.random() * 2 + 1;
            const size = Math.random() * 2 + 1;
            
            money.style.left = startX + 'px';
            money.style.animationDuration = duration + 's';
            money.style.fontSize = size + 'rem';
            money.style.opacity = Math.random();
            
            document.body.appendChild(money);
            
            setTimeout(() => {
                money.remove();
            }, duration * 1000);
        }

        container.addEventListener('click', () => {
            if (gift.classList.contains('hidden')) return;

            if (window.navigator.vibrate) {
                window.navigator.vibrate([100, 50, 100, 50, 200]);
            }

            gift.classList.add('hidden');
            message.classList.add('show');
            
            document.body.style.background = '#fff';
            
            // Start money rain
            for(let i = 0; i < 100; i++) {
                setTimeout(createMoney, i * 50);
            }
            
            // Continuous rain
            setInterval(createMoney, 100);
        });
    </script>
</body>
</html>
